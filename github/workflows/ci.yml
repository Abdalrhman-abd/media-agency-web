name: CI & Build Check

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ chore/deploy ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint --if-present

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: https://media-website-api.vercel.app/api/v1